<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bulkbase admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="/admin.html">Bulk<b>base</b> admin</a>
    <button class="btn alt hide" id="out" style="margin-left:auto">Log out</button>
  </header>

  <div class="wrap">

    <!-- LOGIN -->
    <section class="panel" id="login" style="max-width:420px">
      <h2>Super admin login</h2>
      <form id="lf">
        <input name="email" type="email" placeholder="Email" required style="width:100%;padding:.5rem;margin:.2rem 0 .7rem">
        <input name="password" type="password" placeholder="Password" required style="width:100%;padding:.5rem;margin:.2rem 0 .7rem">
        <button class="btn">Log in</button>
      </form>
    </section>

    <!-- DASHBOARD -->
    <div id="dash" class="hide">

      <!-- Add / edit appliance -->
      <section class="panel">
        <h2 id="ft">Add appliance</h2>
        <form id="pf" class="form">
          <input type="hidden" name="id">

          <input name="name" placeholder="Name" required>

          <input name="category" list="cl" placeholder="Category (Dumbbells, Treadmills...)">
          <datalist id="cl"></datalist>

          <input name="price" type="number" min="1" placeholder="Price (Ksh)" required>
          <input name="sale_price" type="number" min="1" placeholder="Sale price (optional)">
          <input name="stock" type="number" min="0" value="1" placeholder="Stock">

          <select name="active" style="width:100%;padding:.5rem;border:1px solid var(--line);border-radius:4px;margin:.2rem 0 .7rem">
            <option value="1">Visible in shop</option>
            <option value="0">Hidden from shop</option>
          </select>

          <div class="full">
            <p style="margin:.3rem 0 .2rem;font-weight:700;font-size:.9rem">Photo (JPG, PNG or WebP, max 5 MB)</p>
            <input name="image" type="file" accept="image/*" style="width:100%;padding:.5rem;border:1px solid var(--line);border-radius:4px">
          </div>

          <div class="full">
            <p style="margin:.3rem 0 .2rem;font-weight:700;font-size:.9rem">Description</p>
            <textarea name="description" rows="3" placeholder="Description" style="width:100%;padding:.5rem;border:1px solid var(--line);border-radius:4px"></textarea>
          </div>

          <div class="full" style="margin-top:.5rem">
            <button class="btn">Save appliance</button>
            <button type="button" class="btn alt hide" id="cancel">Cancel edit</button>
          </div>
        </form>
      </section>

      <!-- Products list -->
      <section class="panel" style="overflow:auto">
        <h2>Products</h2>
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Name</th>
              <th>Price</th>
              <th>Stock</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pt"></tbody>
        </table>
      </section>

      <!-- Orders list -->
      <section class="panel" style="overflow:auto">
        <h2>Orders</h2>
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Items</th>
              <th>Total</th>
              <th>Payment / Status</th>
            </tr>
          </thead>
          <tbody id="ot"></tbody>
        </table>
      </section>

    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
