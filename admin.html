<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulkbase admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="logo" href="/admin.html">Bulk<b>base</b> admin</a><button class="btn alt hide" id="out" style="margin-left:auto">Log out</button></header>
<div class="wrap">
<section class="panel" id="login" style="max-width:420px"><h2>Super admin login</h2><form id="lf"><label>Email<input name="email" type="email" required style="width:100%;padding:.5rem;margin:.2rem 0 .7rem"></label><label>Password<input name="password" type="password" required style="width:100%;padding:.5rem;margin:.2rem 0 .7rem"></label><button class="btn">Log in</button></form></section>
<div id="dash" class="hide">
<section class="panel"><h2 id="ft">Add appliance</h2><form id="pf" class="form"><input type="hidden" name="id">
<label>Name<input name="name" required></label><label>Category<input name="category" list="cl" placeholder="Dumbbells, Treadmills..."><datalist id="cl"></datalist></label>
<label>Price (Ksh)<input name="price" type="number" min="1" required></label><label>Sale price (optional)<input name="sale_price" type="number" min="1"></label>
<label>Stock<input name="stock" type="number" min="0" value="1"></label><label>Visible in shop<select name="active"><option value="1">Yes</option><option value="0">No</option></select></label>
<label class="full">Photo (JPG, PNG or WebP, max 5 MB)<input name="image" type="file" accept="image/*"></label><label class="full">Description<textarea name="description" rows="3"></textarea></label>
<div class="full"><button class="btn">Save appliance</button> <button type="button" class="btn alt hide" id="cancel">Cancel edit</button></div></form></section>
<section class="panel" style="overflow:auto"><h2>Products</h2><table><thead><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="pt"></tbody></table></section>
<section class="panel" style="overflow:auto"><h2>Orders</h2><table><tbody id="ot"></tbody></table></section></div></div>
<script type="module" src="admin.js"></script></body></html>
